name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v2.0.8
        required: true
        default: v2.0.8

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm run check:public
      - run: bash -n ops/*.sh
      - run: python3 -m py_compile server/sync/*.py

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version='${{ inputs.version }}'
          else
            version="${GITHUB_REF_NAME}"
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          package_version=$(node -p "require('./package.json').version")
          [[ "$version" == "v$package_version" ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Reject duplicate release
        shell: bash
        run: |
          if gh release view '${{ steps.version.outputs.value }}' --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists' >&2
            exit 1
          fi
      - name: Create tag for manual release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          version='${{ steps.version.outputs.value }}'
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null 2>&1; then
            echo 'Tag already exists' >&2
            exit 1
          fi
          gh api --method POST "/repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$version" -f "sha=$GITHUB_SHA" >/dev/null
      - name: Build public VPS packages
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.value }}'
          name="address-$version"
          mkdir -p "release/$name"
          for path in .dockerignore .env.example Dockerfile docker-compose.yml LICENSE README.md README.zh-CN.md README.zh-TW.md astro.config.mjs package.json package-lock.json tsconfig.json config docs image ops public scripts server src; do
            cp -a "$path" "release/$name/"
          done
          cp -a dist "release/$name/dist"
          find "release/$name" -type d -name __pycache__ -prune -exec rm -rf {} +
          tar -C release -czf "release/$name.tar.gz" "$name"
          (cd release && zip -qr "$name.zip" "$name")
          (cd release && sha256sum "$name.tar.gz" "$name.zip" > SHA256SUMS.txt)
      - name: Audit package contents
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.value }}'
          name="address-$version"
          test -s "release/$name.tar.gz"
          test -s "release/$name.zip"
          test -s release/SHA256SUMS.txt
          if find "release/$name" -type f \( -name '.env' -o -name '*.sqlite' -o -name '*.db' -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .; then
            echo 'Private file shape found in release package' >&2
            exit 1
          fi
          (cd release && sha256sum -c SHA256SUMS.txt)
      - name: Write release notes
        shell: bash
        run: |
          version='${{ steps.version.outputs.value }}'
          cat > release/RELEASE_NOTES.md <<'NOTES'
          ### Address data and synchronization
          - Restored recoverable addresses through fair, bounded translation retries and cache recovery while retaining source records when translation fails.
          - Added support for genuine street-level addresses outside China, marked with `matchLevel: street`; missing house and unit fields remain empty. China retains its residential address contract.
          - Corrected publication indexes, administrative assignments, country counts, and coverage reporting while preserving country, coordinate, source, language, and identifier validation.
          - Unified administrative node IDs and per-node targets across imports, country completion checks, and the China coverage tracker, with compatibility for existing settings.

          ### Translation and credentials
          - Added OpenAI-compatible translation with live model discovery, complete searchable model lists, manual model entry, normalized endpoint URLs, and explicit low reasoning by default.
          - Added independent API-key priorities for OpenAI-compatible, DeepL, and Youdao translation, plus configurable priority for keyless Google translation.
          - Made initial online imports honor the same key priorities, disabled states, prompts, and broker accounting as translation recovery.
          - Fixed stale address translation caches, expired cooldown handling, and HTTP-date Retry-After parsing. Full translation prompts preserve address facts and identifiers; one-time DeepL rewards are not replenished locally.

          ### Documentation and verification
          - Improved responsive administrator forms, the model picker, translation controls, and hierarchical coverage navigation.
          - Updated the English, Simplified Chinese, and Traditional Chinese API/key guides and all country strategy documents.
          - Verified 1,402 JavaScript/TypeScript tests, 105 Python tests, type checks, builds, PostgreSQL migration fixtures, and 500 live address-contract samples per supported country.
          NOTES
      - name: Publish stable GitHub release
        shell: bash
        run: |
          version='${{ steps.version.outputs.value }}'
          gh release create "$version" \
            "release/address-$version.tar.gz" \
            "release/address-$version.zip" \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "$version" \
            --notes-file release/RELEASE_NOTES.md \
            --verify-tag
